openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Pharmacy dashboard summaries
  - name: drugs
    description: PBS drug reference data
  - name: pbs
    description: PBS item and price information
  - name: changes
    description: PBS schedule change feed
  - name: artg
    description: ARTG registration data
  - name: stock
    description: Private pharmacy stock records
  - name: admin
    description: Administrator ingestion controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get pharmacy dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pharmacy-brand-preferences:
    get:
      operationId: getPharmacyBrandPreferences
      tags: [preferences]
      summary: List the signed-in pharmacy's brand display preferences
      responses:
        "200":
          description: Brand catalogue and the signed-in pharmacy's display preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyBrandPreferences"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setPharmacyBrandPreference
      tags: [preferences]
      summary: Set whether a brand is hidden for the signed-in pharmacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacyBrandPreferenceInput"
      responses:
        "200":
          description: Updated brand preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyBrandPreferences"
        "400":
          description: Invalid preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pharmacy-brand-preferences/bulk:
    put:
      operationId: setPharmacyBrandPreferences
      tags: [preferences]
      summary: Apply multiple brand display preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacyBrandPreferencesInput"
      responses:
        "200":
          description: Updated brand preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyBrandPreferences"
        "400":
          description: Invalid preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: clearPharmacyBrandPreferences
      tags: [preferences]
      summary: Show every brand for the signed-in pharmacy
      responses:
        "204":
          description: Preferences cleared
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /drugs:
    get:
      operationId: listDrugs
      tags: [drugs]
      summary: List PBS drugs
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by drug name, active ingredient, or sponsor
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Drug records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Drug"
  /drugs/{id}:
    get:
      operationId: getDrug
      tags: [drugs]
      summary: Get a PBS drug
      parameters:
        - $ref: "#/components/parameters/DrugId"
      responses:
        "200":
          description: Drug record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drug"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /medicine-directory:
    get:
      operationId: listMedicineDirectory
      tags: [drugs]
      summary: List grouped PBS medicines
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by drug, ingredient, brand, PBS code, or LI item ID
      responses:
        "200":
          description: Drug-level medicine summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicineDrugSummary"
  /medicine-drugs/{id}/brands:
    get:
      operationId: listMedicineBrands
      tags: [drugs]
      summary: List brand summaries for a medicine
      parameters:
        - $ref: "#/components/parameters/DrugId"
      responses:
        "200":
          description: Brand-level medicine summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicineBrandSummary"
  /medicine-drugs/{id}/brands/{brandName}/items:
    get:
      operationId: listMedicineBrandItems
      tags: [drugs]
      summary: List PBS items for a medicine brand
      parameters:
        - $ref: "#/components/parameters/DrugId"
        - $ref: "#/components/parameters/BrandName"
      responses:
        "200":
          description: Item-level PBS listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicineBrandItemSummary"
  /upcoming-predicted-reductions:
    get:
      operationId: listUpcomingPredictedReductions
      tags: [pbs]
      summary: List upcoming predicted PBS price reductions grouped by exact price change
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
          description: Inclusive effective date. Defaults to today.
        - name: to
          in: query
          schema:
            type: string
            format: date
          description: Inclusive effective date.
        - name: confidence
          in: query
          schema:
            type: string
            enum: [high, conditional, indicative, confirmed]
      responses:
        "200":
          description: Upcoming prediction events grouped by medicine and effective date, ordered by date then largest reduction size
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingPredictedReductionGroup"
  /pbs-items:
    get:
      operationId: listPbsItems
      tags: [pbs]
      summary: List PBS items
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Tokenised search across item code, PBS code, brand name, drug name, active ingredient, and normalised strength
        - name: formulary
          in: query
          schema:
            type: string
            enum: [F1, F2]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: PBS item records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PbsItem"
  /pbs-items/{itemCode}:
    get:
      operationId: getPbsItem
      tags: [pbs]
      summary: Get a PBS item
      parameters:
        - $ref: "#/components/parameters/ItemCode"
      responses:
        "200":
          description: PBS item record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbsItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pbs-items/{itemCode}/price-history:
    get:
      operationId: listPriceHistory
      tags: [pbs]
      summary: List price history for a PBS item
      parameters:
        - $ref: "#/components/parameters/ItemCode"
      responses:
        "200":
          description: Historical prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceHistory"
  /pbs-items/{itemCode}/premium-history:
    get:
      operationId: listItemPremiumHistory
      tags: [pbs]
      summary: List patient premium history for a PBS item
      parameters:
        - $ref: "#/components/parameters/ItemCode"
      responses:
        "200":
          description: Historical PBS brand and therapeutic-group premiums
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PbsItemPremiumHistory"
  /pbs-items/{itemCode}/predicted-reductions:
    get:
      operationId: listItemPredictedReductions
      tags: [pbs]
      summary: List predicted reductions for a PBS item
      parameters:
        - $ref: "#/components/parameters/ItemCode"
      responses:
        "200":
          description: Predicted reductions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PredictedReduction"
  /pbs-items/{itemCode}/schedule-changes:
    get:
      operationId: listItemScheduleChanges
      tags: [changes]
      summary: List schedule changes for a PBS item
      parameters:
        - $ref: "#/components/parameters/ItemCode"
      responses:
        "200":
          description: Item schedule changes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleChange"
  /schedule-changes:
    get:
      operationId: listScheduleChanges
      tags: [changes]
      summary: List PBS schedule changes
      parameters:
        - name: drugId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: changeType
          in: query
          schema:
            type: string
            enum: [new_item, new_brand, delisted, price_change, formulary_change, listing_amendment, premium_added, premium_changed, premium_removed]
        - name: significance
          in: query
          schema:
            type: string
            enum: [normal, medium, high]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Chronological schedule changes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleChange"
  /drugs/{id}/schedule-timeline:
    get:
      operationId: getDrugScheduleTimeline
      tags: [changes]
      summary: Get the schedule-change timeline for a drug
      parameters:
        - $ref: "#/components/parameters/DrugId"
      responses:
        "200":
          description: Drug schedule-change timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleChange"
  /artg-entries:
    get:
      operationId: listArtgEntries
      tags: [artg]
      summary: List ARTG registrations
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by ARTG ID, active ingredient, sponsor, or product name
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ARTG records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtgEntry"
  /artg-import-status:
    get:
      operationId: getArtgImportStatus
      tags: [artg]
      summary: Get the ARTG import status
      responses:
        "200":
          description: ARTG import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtgImportStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stock:
    get:
      operationId: listStock
      tags: [stock]
      summary: List the signed-in user's stock
      responses:
        "200":
          description: Private stock records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockExposureResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createStock
      tags: [stock]
      summary: Add a stock record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacyStockInput"
      responses:
        "201":
          description: Created stock record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyStock"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stock/{id}:
    patch:
      operationId: updateStock
      tags: [stock]
      summary: Update a stock record
      parameters:
        - $ref: "#/components/parameters/StockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacyStockUpdate"
      responses:
        "200":
          description: Updated stock record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyStock"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteStock
      tags: [stock]
      summary: Delete a stock record
      parameters:
        - $ref: "#/components/parameters/StockId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/ingestion-runs:
    get:
      operationId: listAdminIngestionRuns
      tags: [admin]
      summary: List recent PBS ingestion runs
      responses:
        "200":
          description: Recent ingestion runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminIngestionRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: triggerAdminIngestion
      tags: [admin]
      summary: Start a PBS ingestion run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIngestionInput"
      responses:
        "202":
          description: Ingestion run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIngestionRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid ingestion options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An ingestion run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/ingestion-runs/current:
    get:
      operationId: getCurrentAdminIngestionRun
      tags: [admin]
      summary: Get the current PBS ingestion run
      responses:
        "200":
          description: Current ingestion run, if one is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAdminIngestionRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/artg-imports:
    get:
      operationId: listAdminArtgImportRuns
      tags: [admin]
      summary: List recent manual ARTG imports
      responses:
        "200":
          description: Recent ARTG import outcomes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtgImportRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: uploadAdminArtgExport
      tags: [admin]
      summary: Import a CSV or Excel ARTG export
      parameters:
        - name: X-ARTG-File-Name
          in: header
          required: true
          schema:
            type: string
          description: Original CSV or Excel file name
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: ARTG import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtgImportRun"
        "400":
          description: Unsupported or invalid ARTG export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/published-files:
    get:
      operationId: listAdminPublishedFiles
      tags: [admin]
      summary: List current PBS published-file ingestion results
      responses:
        "200":
          description: Published-file ingestion results and watchlist match failures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPublishedFile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/pbs-watchlist:
    get:
      operationId: listPbsWatchlistEntries
      tags: [admin]
      summary: List PBS ingestion watchlist entries
      responses:
        "200":
          description: PBS watchlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PbsWatchlistEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPbsWatchlistEntry
      tags: [admin]
      summary: Add a PBS ingestion watchlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbsWatchlistEntryInput"
      responses:
        "201":
          description: Created watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbsWatchlistEntry"
        "400":
          description: Invalid watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/pbs-watchlist/{id}:
    patch:
      operationId: updatePbsWatchlistEntry
      tags: [admin]
      summary: Update a PBS ingestion watchlist entry
      parameters:
        - $ref: "#/components/parameters/WatchlistEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbsWatchlistEntryUpdate"
      responses:
        "200":
          description: Updated watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbsWatchlistEntry"
        "400":
          description: Invalid watchlist update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Watchlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePbsWatchlistEntry
      tags: [admin]
      summary: Delete a PBS ingestion watchlist entry
      parameters:
        - $ref: "#/components/parameters/WatchlistEntryId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Watchlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/schedule-change-settings:
    get:
      operationId: getScheduleChangeSettings
      tags: [admin]
      summary: Get schedule-change significance thresholds
      responses:
        "200":
          description: Current threshold settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleChangeSettings"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateScheduleChangeSettings
      tags: [admin]
      summary: Update schedule-change significance thresholds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleChangeSettings"
      responses:
        "200":
          description: Updated threshold settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleChangeSettings"
        "400":
          description: Invalid thresholds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    DrugId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ItemCode:
      name: itemCode
      in: path
      required: true
      schema:
        type: string
    BrandName:
      name: brandName
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    StockId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    WatchlistEntryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Drug:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        activeIngredient:
          type: string
        sponsor:
          type: string
        firstPbsListingDate:
          type: string
          format: date
      required: [id, name, activeIngredient, sponsor, firstPbsListingDate]
    MedicineDrugSummary:
      type: object
      properties:
        drugId:
          type: integer
        drugName:
