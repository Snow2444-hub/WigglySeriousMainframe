openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Pharmacy dashboard summaries
  - name: drugs
    description: PBS drug reference data
  - name: pbs
    description: PBS item and price information
  - name: changes
    description: PBS schedule change feed
  - name: artg
    description: ARTG registration data
  - name: stock
    description: Private pharmacy stock records
  - name: admin
    description: Administrator ingestion controls
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get pharmacy dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /drugs:
    get:
      operationId: listDrugs
      tags: [drugs]
      summary: List PBS drugs
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by drug name, active ingredient, or sponsor
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Drug records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Drug"
  /drugs/{id}:
    get:
      operationId: getDrug
      tags: [drugs]
      summary: Get a PBS drug
      parameters:
        - $ref: "#/components/parameters/DrugId"
      responses:
        "200":
          description: Drug record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drug"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pbs-items:
    get:
      operationId: listPbsItems
      tags: [pbs]
      summary: List PBS items
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by item code, brand name, or drug name
        - name: formulary
          in: query
          schema:
            type: string
            enum: [F1, F2]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: PBS item records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PbsItem"
  /pbs-items/{itemCode}:
    get:
      operationId: getPbsItem
      tags: [pbs]
      summary: Get a PBS item
      parameters:
        - $ref: "#/components/parameters/ItemCode"
      responses:
        "200":
          description: PBS item record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbsItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pbs-items/{itemCode}/price-history:
    get:
      operationId: listPriceHistory
      tags: [pbs]
      summary: List price history for a PBS item
      parameters:
        - $ref: "#/components/parameters/ItemCode"
      responses:
        "200":
          description: Historical prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceHistory"
  /schedule-changes:
    get:
      operationId: listScheduleChanges
      tags: [changes]
      summary: List PBS schedule changes
      parameters:
        - name: drugId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: changeType
          in: query
          schema:
            type: string
            enum: [new_item, new_brand, delisted, price_change, formulary_change]
        - name: significance
          in: query
          schema:
            type: string
            enum: [normal, high]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Chronological schedule changes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleChange"
  /drugs/{id}/schedule-timeline:
    get:
      operationId: getDrugScheduleTimeline
      tags: [changes]
      summary: Get the schedule-change timeline for a drug
      parameters:
        - $ref: "#/components/parameters/DrugId"
      responses:
        "200":
          description: Drug schedule-change timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleChange"
  /artg-entries:
    get:
      operationId: listArtgEntries
      tags: [artg]
      summary: List ARTG registrations
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by ARTG ID, active ingredient, sponsor, or product name
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ARTG records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtgEntry"
  /stock:
    get:
      operationId: listStock
      tags: [stock]
      summary: List the signed-in user's stock
      responses:
        "200":
          description: Private stock records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PharmacyStock"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createStock
      tags: [stock]
      summary: Add a stock record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacyStockInput"
      responses:
        "201":
          description: Created stock record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyStock"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stock/{id}:
    patch:
      operationId: updateStock
      tags: [stock]
      summary: Update a stock record
      parameters:
        - $ref: "#/components/parameters/StockId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PharmacyStockUpdate"
      responses:
        "200":
          description: Updated stock record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PharmacyStock"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteStock
      tags: [stock]
      summary: Delete a stock record
      parameters:
        - $ref: "#/components/parameters/StockId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/ingestion-runs:
    get:
      operationId: listAdminIngestionRuns
      tags: [admin]
      summary: List recent PBS ingestion runs
      responses:
        "200":
          description: Recent ingestion runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminIngestionRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: triggerAdminIngestion
      tags: [admin]
      summary: Start a PBS ingestion run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminIngestionInput"
      responses:
        "202":
          description: Ingestion run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIngestionRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid ingestion options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An ingestion run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/ingestion-runs/current:
    get:
      operationId: getCurrentAdminIngestionRun
      tags: [admin]
      summary: Get the current PBS ingestion run
      responses:
        "200":
          description: Current ingestion run, if one is active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAdminIngestionRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/pbs-watchlist:
    get:
      operationId: listPbsWatchlistEntries
      tags: [admin]
      summary: List PBS ingestion watchlist entries
      responses:
        "200":
          description: PBS watchlist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PbsWatchlistEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPbsWatchlistEntry
      tags: [admin]
      summary: Add a PBS ingestion watchlist entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbsWatchlistEntryInput"
      responses:
        "201":
          description: Created watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbsWatchlistEntry"
        "400":
          description: Invalid watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/pbs-watchlist/{id}:
    patch:
      operationId: updatePbsWatchlistEntry
      tags: [admin]
      summary: Update a PBS ingestion watchlist entry
      parameters:
        - $ref: "#/components/parameters/WatchlistEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbsWatchlistEntryUpdate"
      responses:
        "200":
          description: Updated watchlist entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbsWatchlistEntry"
        "400":
          description: Invalid watchlist update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Watchlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePbsWatchlistEntry
      tags: [admin]
      summary: Delete a PBS ingestion watchlist entry
      parameters:
        - $ref: "#/components/parameters/WatchlistEntryId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Watchlist entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    DrugId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ItemCode:
      name: itemCode
      in: path
      required: true
      schema:
        type: string
    StockId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    WatchlistEntryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Drug:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        activeIngredient:
          type: string
        sponsor:
          type: string
        firstPbsListingDate:
          type: string
          format: date
      required: [id, name, activeIngredient, sponsor, firstPbsListingDate]
    PbsItem:
      type: object
      properties:
        itemCode:
          type: string
        pbsCode:
          type: ["string", "null"]
        liItemId:
          type: ["string", "null"]
        scheduleCode:
          type: ["integer", "null"]
        drugId:
          type: integer
        brandName:
          type: string
        strength:
          type: ["string", "null"]
        form:
          type: ["string", "null"]
        packSize:
          type: ["string", "null"]
        pricingQuantity:
          type: ["integer", "null"]
        liForm:
          type: ["string", "null"]
        programCode:
          type: ["string", "null"]
        drugName:
          type: string
        activeIngredient:
          type: string
        sponsor:
          type: string
        formulary:
          type: string
          enum: [F1, F2]
        currentAemp:
          type: number
        currentDpmq:
          type: ["number", "null"]
        lastUpdated:
          type: string
          format: date
        firstListedDate:
          type: ["string", "null"]
          format: date
        weightedAvgDisclosedPrice:
          type: ["number", "null"]
        originatorBrandIndicator:
          type: ["string", "null"]
        brandSubstitutionGroupId:
          type: ["string", "null"]
        advancedNoticeDate:
          type: ["string", "null"]
          format: date
        nonEffectiveDate:
          type: ["string", "null"]
          format: date
        determinedPrice:
          type: ["number", "null"]
        claimedPrice:
          type: ["number", "null"]
        proportionalPrice:
          type: ["number", "null"]
        therapeuticGroupId:
          type: ["string", "null"]
        innovatorIndicator:
          type: ["string", "null"]
      required: [itemCode, pbsCode, liItemId, scheduleCode, drugId, brandName, strength, form, packSize, pricingQuantity, liForm, programCode, drugName, activeIngredient, sponsor, formulary, currentAemp, currentDpmq, lastUpdated, firstListedDate, weightedAvgDisclosedPrice, originatorBrandIndicator, brandSubstitutionGroupId, advancedNoticeDate, nonEffectiveDate, determinedPrice, claimedPrice, proportionalPrice, therapeuticGroupId, innovatorIndicator]
    PriceHistory:
      type: object
      properties:
        id:
          type: integer
        itemCode:
          type: string
        priceDate:
          type: string
          format: date
        scheduleCode:
          type: integer
        scheduleEffectiveDate:
          type: string
          format: date
        aemp:
          type: number
        dpmq:
          type: ["number", "null"]
        reductionType:
          type: ["string", "null"]
      required: [id, itemCode, priceDate, scheduleCode, scheduleEffectiveDate, aemp, dpmq, reductionType]
    ScheduleChange:
      type: object
      properties:
        id:
          type: integer
        scheduleCode:
          type: integer
        effectiveDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        changeType:
          type: string
          enum: [new_item, new_brand, delisted, price_change, formulary_change]
        liItemId:
          type: string
        pbsCode:
          type: ["string", "null"]
        drugId:
          type: integer
        drugName:
          type: string
        brandName:
          type: ["string", "null"]
        oldValue:
          type: ["object", "null"]
          additionalProperties: true
        newValue:
          type: ["object", "null"]
          additionalProperties: true
        significance:
          type: string
          enum: [normal, high]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, scheduleCode, effectiveDate, changeType, liItemId, pbsCode, drugId, drugName, brandName, oldValue, newValue, significance, notes, createdAt]
    ArtgEntry:
      type: object
      properties:
        artgId:
          type: string
        activeIngredient:
          type: string
        sponsor:
          type: string
        registrationDate:
          type: string
          format: date
        productName:
          type: string
        status:
          type: string
      required: [artgId, activeIngredient, sponsor, registrationDate, productName, status]
    PharmacyStock:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        itemCode:
          type: string
        brandName:
          type: string
        quantity:
          type: integer
        purchasePrice:
          type: number
        purchaseDate:
          type: string
          format: date
      required: [id, userId, itemCode, brandName, quantity, purchasePrice, purchaseDate]
    PharmacyStockInput:
      type: object
      properties:
        itemCode:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 0
        purchasePrice:
          type: number
          minimum: 0
        purchaseDate:
          type: string
          format: date
      required: [itemCode, quantity, purchasePrice, purchaseDate]
    PharmacyStockUpdate:
      type: object
      properties:
        itemCode:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 0
        purchasePrice:
          type: number
          minimum: 0
        purchaseDate:
          type: string
          format: date
    DashboardSummary:
      type: object
      properties:
        totalStockUnits:
          type: integer
        stockLineCount:
          type: integer
        trackedItems:
          type: integer
        formularyBreakdown:
          type: object
          properties:
            F1:
              type: integer
            F2:
              type: integer
          required: [F1, F2]
        recentStock:
          type: array
          items:
            $ref: "#/components/schemas/PharmacyStock"
      required: [totalStockUnits, stockLineCount, trackedItems, formularyBreakdown, recentStock]
    AdminIngestionRun:
      type: object
      properties:
        id:
          type: integer
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [queued, running, completed, failed]
        recordsProcessed:
          type: integer
        pagesFetched:
          type: integer
        requestUrls:
          type: array
          items:
            type: string
        errorMessage:
          type: ["string", "null"]
      required: [id, startedAt, finishedAt, status, recordsProcessed, pagesFetched, requestUrls, errorMessage]
    AdminIngestionInput:
      type: object
      properties:
        mode:
          type: string
          enum: [current, backfill]
          default: current
          description: Current fetches the latest schedule; backfill fetches the available rolling 12-month schedule history.
        maxPages:
          type: integer
          minimum: 1
          maximum: 10000
          description: Optional total page cap across all configured PBS endpoints; omit for the full schedule.
    CurrentAdminIngestionRun:
      type: object
      properties:
        currentRun:
          oneOf:
            - $ref: "#/components/schemas/AdminIngestionRun"
            - type: "null"
      required: [currentRun]
    PbsWatchlistEntry:
      type: object
      properties:
        id:
          type: integer
        filterType:
          type: string
          enum: [brand_name, drug_name, pbs_code, formulary, program_code, atc_code]
        filterValue:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, filterType, filterValue, enabled, createdAt, updatedAt]
    PbsWatchlistEntryInput:
      type: object
      properties:
        filterType:
          type: string
          enum: [brand_name, drug_name, pbs_code, formulary, program_code, atc_code]
        filterValue:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
          type: boolean
          default: true
      required: [filterType, filterValue]
    PbsWatchlistEntryUpdate:
      type: object
      properties:
        filterType:
          type: string
          enum: [brand_name, drug_name, pbs_code, formulary, program_code, atc_code]
        filterValue:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
          type: boolean

